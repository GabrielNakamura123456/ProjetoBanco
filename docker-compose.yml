services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: projeto-banco-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: projeto-banco-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
